services:
  anti_knock.detector:
    class: Drupal\anti_knock\Service\DetectorService
    arguments: [
      '@config.factory',
      '@logger.factory',
      '@database',
      '@ban.ip_manager',
      '@current_user',
      '@page_cache_kill_switch'
    ]

  anti_knock.subscriber:
    class: Drupal\anti_knock\EventSubscriber\AntiKnockEventSubscriber
    arguments: [
      '@anti_knock.detector'
    ]
    tags:
      - { name: 'event_subscriber' }

  Drupal\anti_knock\Hook\AntiKnockHooks:
    class: Drupal\anti_knock\Hook\AntiKnockHooks
    autowire: true
